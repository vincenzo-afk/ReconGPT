name: Feature request
description: Propose a bounded, evidence-first improvement to ReconGPT.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Analyst problem
      description: Describe the practical investigation or workflow problem to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Explain the user-facing behavior and expected evidence/source output.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Source and safety boundary
      description: Identify public or authorized sources, expected limits, consent requirements, retention impact, and likely failure modes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal does not require active scanning, credential collection, authentication bypasses, direct `.onion` access, or unauthorized data collection.
          required: true
